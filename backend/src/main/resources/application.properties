spring.application.name=mindspark-backend
server.port=${SERVER_PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/mindspark}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mindspark}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://${HOST_IP:localhost}:8180/realms/mindspark}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

mindspark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://${HOST_IP:localhost}:4200}
