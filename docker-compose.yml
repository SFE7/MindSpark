include:
  - path: infra/auth/compose.yaml
    env_file: .env

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: mindspark
      POSTGRES_USER: ${APP_DB_USER:-mindspark}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-mindspark} -d mindspark"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  discovery-server:
    build: ./discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: discovery-server
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    networks:
      - backend_net

  config-server:
    build: ./config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_PATH: file:/config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx160m"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      discovery-server:
        condition: service_started
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8082"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    environment:
      SERVER_PORT: 8082
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      EUREKA_INSTANCE_HOSTNAME: backend
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      HOST_IP: ${HOST_IP}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mindspark
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-mindspark}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://${HOST_IP}:4200
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8083
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-mindspark-internal-dev-key}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
      - auth_net

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xmx192m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - frontend_net
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - frontend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mindspark.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  ai-db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-ai_db}
      POSTGRES_USER: ${AI_DB_USER:-ai_user}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-ai_user} -d ${AI_DB_NAME:-ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-db:5432/${AI_DB_NAME:-ai_db}
      SPRING_DATASOURCE_USERNAME: ${AI_DB_USER:-ai_user}
      SPRING_DATASOURCE_PASSWORD: ${AI_DB_PASSWORD}
      HOST_IP: ${HOST_IP:-localhost}
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:-localhost}:4200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      ai-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend_net
      - auth_net

  subscription-db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SUBSCRIPTION_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${SUBSCRIPTION_DB_NAME:-subscription_db}
      POSTGRES_USER: ${SUBSCRIPTION_DB_USER:-subscription_user}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-subscription_dev_pass}
    volumes:
      - subscription_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUBSCRIPTION_DB_USER:-subscription_user} -d ${SUBSCRIPTION_DB_NAME:-subscription_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      JAVA_TOOL_OPTIONS: "-Xmx192m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://subscription-db:5432/${SUBSCRIPTION_DB_NAME:-subscription_db}
      SPRING_DATASOURCE_USERNAME: ${SUBSCRIPTION_DB_USER:-subscription_user}
      SPRING_DATASOURCE_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-subscription_dev_pass}
      HOST_IP: ${HOST_IP:-localhost}
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:-localhost}:4200}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-mindspark-internal-dev-key}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PRODUCT_ID_PREMIUM: ${POLAR_PRODUCT_ID_PREMIUM:-}
      POLAR_PRODUCT_ID_TEAM: ${POLAR_PRODUCT_ID_TEAM:-}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      subscription-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - backend_net
      - auth_net

  session-db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SESSION_DB_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: ${SESSION_DB_NAME:-session_db}
      POSTGRES_USER: ${SESSION_DB_USER:-session_user}
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:-session_dev_pass}
    volumes:
      - session_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_DB_USER:-session_user} -d ${SESSION_DB_NAME:-session_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  session-service:
    build:
      context: ./session-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_DATASOURCE_URL: jdbc:postgresql://session-db:5432/${SESSION_DB_NAME:-session_db}
      SPRING_DATASOURCE_USERNAME: ${SESSION_DB_USER:-session_user}
      SPRING_DATASOURCE_PASSWORD: ${SESSION_DB_PASSWORD:-session_dev_pass}
      HOST_IP: ${HOST_IP:-localhost}
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:-localhost}:4200}
      BACKEND_SERVICE_URL: http://backend:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-mindspark-internal-dev-key}
    depends_on:
      session-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend_net
      - auth_net

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - media_uploads:/data/media
    environment:
      SERVER_PORT: 8085
      JAVA_TOOL_OPTIONS: "-Xmx192m"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      BACKEND_SERVICE_URL: http://backend:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-mindspark-internal-dev-key}
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:-localhost}:4200}
      MEDIA_STORAGE_DIR: /data/media
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend_net
      - auth_net

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    networks:
      - backend_net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - notification_data:/data
    environment:
      PORT: 8086
      NOTIFICATION_DB_PATH: /data/notifications.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8180/realms/mindspark
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:-localhost}:4200
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - backend_net
      - auth_net

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - backend_net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend_net

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - backend_net

volumes:
  app_db_data:
  ai_db_data:
  subscription_db_data:
  session_db_data:
  media_uploads:
  kafka_data:
  notification_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  maven_cache:
    name: mindspark_maven_cache

networks:
  frontend_net:
  backend_net:
  auth_net:
    name: auth_net
