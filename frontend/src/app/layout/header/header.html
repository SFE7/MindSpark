<header class="topbar">
  <a class="brand" routerLink="/" aria-label="MindSpark home">
    <span class="brand-mark">M</span>
    <span class="brand-name">mind<span>spark</span></span>
  </a>

  <div class="connection-buttons">
    @if (isLoggedIn) {
      @if (currentUser(); as user) {
        <div class="account-dropdown">
          <button
            class="username-trigger"
            type="button"
            [attr.aria-expanded]="accountMenuOpen()"
            aria-haspopup="menu"
            (click)="toggleAccountMenu($event)"
          >
            <span class="username">{{ user.username }}</span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>

          @if (accountMenuOpen()) {
            <div class="account-menu" role="menu">
              <button
                class="menu-item action-button"
                type="button"
                role="menuitem"
                (click)="changePassword()"
              >
                Update password
              </button>
              <button
                class="menu-item danger-button"
                type="button"
                role="menuitem"
                (click)="deleteAccount()"
              >
                Delete account
              </button>
            </div>
          }
        </div>
      }

      <button class="auth-button logout-button" type="button" (click)="logout()">
        Log out <span aria-hidden="true">↗</span>
      </button>
    } @else {
      <button class="auth-button login-button" type="button" (click)="login()">
        Log in
      </button>
      <button class="auth-button register-button" type="button" (click)="register()">
        Create account <span aria-hidden="true">↗</span>
      </button>
    }
  </div>
</header>
