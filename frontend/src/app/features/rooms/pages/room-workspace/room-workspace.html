<main class="room-page">
  @if (room(); as currentRoom) {
    <app-workspace-canvas
      [roomId]="currentRoom.id"
      [room]="currentRoom"
      (leave)="leaveRoom()"
      (roomChanged)="updateRoom($event)"
    />
  }
  @if (error()) {
    <div class="workspace-error" role="alert">{{ error() }}</div>
  }
</main>
