server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: collaboration-websocket-service
          uri: lb:ws://mindspark-backend
          predicates:
            - Path=/ws/**

        - id: user-auth-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/users/**, /api/health/**

        - id: room-management-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/rooms/**, /api/presence/**

        - id: idea-voting-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/ideas/**, /api/votes/**

        - id: comment-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/comments/**

        - id: category-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/categories/**

        - id: drawing-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/drawings/**

        - id: monolith-fallback-service
          uri: lb://mindspark-backend
          predicates:
            - Path=/api/**

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
