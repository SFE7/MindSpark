spring.application.name=ai-service
server.port=${SERVER_PORT:8081}

# Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Resilience4j Local Defaults
resilience4j.circuitbreaker.instances.aiExternalProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiExternalProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiExternalProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiExternalProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiExternalProvider.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.aiExternalProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiExternalProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.aiExternalProvider.ignoreExceptions=com.mindspark.ai.common.exception.ValidationException,com.mindspark.ai.common.exception.DailyLimitReachedException,com.mindspark.ai.provider.exception.ProviderBadRequest,com.mindspark.ai.provider.exception.ModelUnavailable
resilience4j.circuitbreaker.instances.aiExternalProvider.ignore-exceptions=com.mindspark.ai.common.exception.ValidationException,com.mindspark.ai.common.exception.DailyLimitReachedException,com.mindspark.ai.provider.exception.ProviderBadRequest,com.mindspark.ai.provider.exception.ModelUnavailable

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://${HOST_IP:localhost}:8180/realms/mindspark}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs}

# Database Configuration (ai-service dedicated database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ai-db:5432/ai_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ai_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# CORS
mindspark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:localhost}:4200}

# AI Tiers Defaults
ai.tiers.free.models=gemini-3.5-flash-lite,gemini-3.1-flash-lite
ai.tiers.free.daily-request-limit=10

ai.tiers.premium.models=openai/gpt-oss-120b,qwen/qwen3.8-27b
ai.tiers.premium.daily-request-limit=20

# AI Provider API Keys (optional from env, empty defaults, never logged)
ai.tiers.gemini-api-key=${GEMINI_API_KEY:}
ai.tiers.groq-api-key=${GROQ_API_KEY:}
ai.gemini-api-key=${GEMINI_API_KEY:}
ai.groq-api-key=${GROQ_API_KEY:}

# AI Global Concurrency Limiter
mindspark.ai.max-concurrent-upstream-calls=${AI_MAX_CONCURRENT_CALLS:8}
mindspark.ai.concurrency-acquire-timeout-ms=${AI_CONCURRENCY_ACQUIRE_TIMEOUT_MS:500}
mindspark.ai.concurrency-retry-after-seconds=${AI_CONCURRENCY_RETRY_AFTER_SECONDS:60}
