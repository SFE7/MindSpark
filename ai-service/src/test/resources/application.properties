spring.application.name=ai-service-test
eureka.client.enabled=false
spring.cloud.config.enabled=false
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.aiExternalProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiExternalProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiExternalProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiExternalProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiExternalProvider.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.aiExternalProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiExternalProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.aiExternalProvider.ignoreExceptions=com.mindspark.ai.common.exception.ValidationException,com.mindspark.ai.common.exception.DailyLimitReachedException,com.mindspark.ai.provider.exception.ProviderBadRequest,com.mindspark.ai.provider.exception.ModelUnavailable
resilience4j.circuitbreaker.instances.aiExternalProvider.ignore-exceptions=com.mindspark.ai.common.exception.ValidationException,com.mindspark.ai.common.exception.DailyLimitReachedException,com.mindspark.ai.provider.exception.ProviderBadRequest,com.mindspark.ai.provider.exception.ModelUnavailable

# In-memory H2 DataSource for tests
spring.datasource.url=jdbc:h2:mem:ai_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Mock Keycloak settings
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mindspark
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/mindspark/protocol/openid-connect/certs

# AI Tiers test properties
ai.tiers.free.models=gemini-3.5-flash-lite,gemini-3.1-flash-lite
ai.tiers.free.daily-request-limit=10
ai.tiers.premium.models=openai/gpt-oss-120b,qwen/qwen3.8-27b
ai.tiers.premium.daily-request-limit=20
ai.tiers.gemini-api-key=test-gemini-key
ai.tiers.groq-api-key=test-groq-key
ai.gemini-api-key=test-gemini-key
ai.groq-api-key=test-groq-key

management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
