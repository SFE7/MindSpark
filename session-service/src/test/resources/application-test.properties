eureka.client.enabled=false
spring.cloud.config.enabled=false
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.backendRoomExport.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backendRoomExport.sliding-window-size=10
resilience4j.circuitbreaker.instances.backendRoomExport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backendRoomExport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.backendRoomExport.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.backendRoomExport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.backendRoomExport.register-health-indicator=true
resilience4j.circuitbreaker.instances.backendRoomExport.ignore-exceptions[0]=com.mindspark.session.exception.RoomNotFoundException
resilience4j.circuitbreaker.instances.backendRoomExport.ignore-exceptions[1]=java.lang.IllegalArgumentException

spring.datasource.url=jdbc:h2:mem:session-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

backend.service.url=http://localhost:8082
mindspark.internal.service-secret=test-internal-secret
mindspark.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
