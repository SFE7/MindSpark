spring.application.name=session-service
server.port=${SERVER_PORT:8084}

# Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Resilience4j Local Defaults
resilience4j.circuitbreaker.instances.backendRoomExport.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backendRoomExport.sliding-window-size=10
resilience4j.circuitbreaker.instances.backendRoomExport.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backendRoomExport.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.backendRoomExport.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.backendRoomExport.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.backendRoomExport.register-health-indicator=true
resilience4j.circuitbreaker.instances.backendRoomExport.ignore-exceptions[0]=com.mindspark.session.exception.RoomNotFoundException
resilience4j.circuitbreaker.instances.backendRoomExport.ignore-exceptions[1]=java.lang.IllegalArgumentException

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://${HOST_IP:localhost}:8180/realms/mindspark}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs}

# Database Configuration (dedicated session-db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://session-db:5432/session_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:session_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:session_dev_pass}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Backend Service Client
backend.service.url=${BACKEND_SERVICE_URL:http://backend:8082}
mindspark.internal.service-secret=${INTERNAL_SERVICE_SECRET:mindspark-internal-dev-key}

# CORS
mindspark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:localhost}:4200}
