spring.application.name=subscription-service
server.port=${SERVER_PORT:8083}

# Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Polar API (Phase 7B)
mindspark.polar.api-base-url=${POLAR_API_BASE_URL:https://sandbox-api.polar.sh}
mindspark.polar.access-token=${POLAR_ACCESS_TOKEN:}
mindspark.polar.product-id-premium=${POLAR_PRODUCT_ID_PREMIUM:}
mindspark.polar.product-id-team=${POLAR_PRODUCT_ID_TEAM:}

# Resilience4j Local Defaults
resilience4j.circuitbreaker.instances.keycloakAdmin.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.keycloakAdmin.sliding-window-size=10
resilience4j.circuitbreaker.instances.keycloakAdmin.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.keycloakAdmin.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.keycloakAdmin.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.keycloakAdmin.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.keycloakAdmin.register-health-indicator=true

resilience4j.circuitbreaker.instances.polarApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.polarApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.polarApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.polarApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.polarApi.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.polarApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.polarApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.polarApi.ignore-exceptions=\
  com.mindspark.subscription.polar.exception.PolarClientException,\
  com.mindspark.subscription.polar.exception.CheckoutOwnershipMismatchException,\
  com.mindspark.subscription.polar.exception.PaymentNotCompletedException,\
  com.mindspark.subscription.polar.exception.UnknownPolarProductException,\
  com.mindspark.subscription.polar.exception.InvalidReturnOriginException

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://${HOST_IP:localhost}:8180/realms/mindspark}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs}

# Kafka Configuration
mindspark.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Database Configuration (dedicated subscription-db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://subscription-db:5432/subscription_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:subscription_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:subscription_dev_pass}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Internal Service Secret for inter-service authentication
mindspark.internal.service-secret=${INTERNAL_SERVICE_SECRET:mindspark-internal-dev-key}

# Keycloak Admin for Role Sync (optional credentials)
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://${HOST_IP:localhost}:8180}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:mindspark}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# CORS
mindspark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:localhost}:4200}
