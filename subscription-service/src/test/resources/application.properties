spring.application.name=subscription-service-test

# In-memory H2 DataSource for tests
spring.datasource.url=jdbc:h2:mem:subscription_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Mock Keycloak settings
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mindspark
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/mindspark/protocol/openid-connect/certs

eureka.client.enabled=false
spring.cloud.config.enabled=false
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.keycloakAdmin.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.keycloakAdmin.sliding-window-size=10
resilience4j.circuitbreaker.instances.keycloakAdmin.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.keycloakAdmin.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.keycloakAdmin.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.keycloakAdmin.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.keycloakAdmin.register-health-indicator=true

resilience4j.circuitbreaker.instances.polarApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.polarApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.polarApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.polarApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.polarApi.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.polarApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.polarApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.polarApi.ignore-exceptions=\
  com.mindspark.subscription.polar.exception.PolarClientException,\
  com.mindspark.subscription.polar.exception.CheckoutOwnershipMismatchException,\
  com.mindspark.subscription.polar.exception.PaymentNotCompletedException,\
  com.mindspark.subscription.polar.exception.UnknownPolarProductException,\
  com.mindspark.subscription.polar.exception.InvalidReturnOriginException

mindspark.polar.api-base-url=https://sandbox-api.polar.sh
mindspark.polar.access-token=mock-polar-token
mindspark.polar.product-id-premium=prod_premium_mock
mindspark.polar.product-id-team=prod_team_mock
mindspark.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://192.168.0.3:4200
mindspark.kafka.enabled=false

management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

