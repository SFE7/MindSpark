spring.application.name=media-service
server.port=${SERVER_PORT:8085}

# Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Resilience4j Local Defaults
resilience4j.circuitbreaker.instances.backendRoomAccess.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backendRoomAccess.sliding-window-size=10
resilience4j.circuitbreaker.instances.backendRoomAccess.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backendRoomAccess.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.backendRoomAccess.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.backendRoomAccess.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.backendRoomAccess.register-health-indicator=true
resilience4j.circuitbreaker.instances.backendRoomAccess.ignore-exceptions[0]=com.mindspark.media.exception.RoomNotFoundException
resilience4j.circuitbreaker.instances.backendRoomAccess.ignore-exceptions[1]=com.mindspark.media.exception.RoomForbiddenException

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://${HOST_IP:localhost}:8180/realms/mindspark}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/mindspark/protocol/openid-connect/certs}

# Backend Service Client
backend.service.url=${BACKEND_SERVICE_URL:http://backend:8082}
mindspark.internal.service-secret=${INTERNAL_SERVICE_SECRET:mindspark-internal-dev-key}

# Media Storage Configuration
mindspark.media.storage-dir=${MEDIA_STORAGE_DIR:/data/media}

# Multipart upload limits (5MB file max, 6MB request max)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS
mindspark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://${HOST_IP:localhost}:4200}
