spring.application.name=media-service-test
eureka.client.enabled=false
spring.cloud.config.enabled=false
management.health.circuitbreakers.enabled=true
mindspark.media.storage-dir=target/test-media

resilience4j.circuitbreaker.instances.backendRoomAccess.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backendRoomAccess.sliding-window-size=10
resilience4j.circuitbreaker.instances.backendRoomAccess.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backendRoomAccess.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.backendRoomAccess.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.backendRoomAccess.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.backendRoomAccess.register-health-indicator=true
resilience4j.circuitbreaker.instances.backendRoomAccess.ignore-exceptions[0]=com.mindspark.media.exception.RoomNotFoundException
resilience4j.circuitbreaker.instances.backendRoomAccess.ignore-exceptions[1]=com.mindspark.media.exception.RoomForbiddenException

management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
